SCENES.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<b>${i+1}</b>${s.name}`;b.onclick=()=>{go(i);P.playing=!reduce||false;sync()};$('chapters').appendChild(b)});
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function explorePanel(host){host.innerHTML=`<p class="note" style="font-size:14px;color:var(--ink);margin:0 0 8px">Drag anywhere on the chart. The dot snaps to the nearest impeller curve and the numbers follow it. The red dashes mark the best efficiency line.</p>
 <div class="segs" role="group" aria-label="Impeller diameter" style="margin-bottom:8px">${['5','5.5','6','6.5','7'].map(k=>`<button type="button" id="imp-${k.replace('.','_')}" data-k="${k}">${IMP[k].label}</button>`).join('')}</div>
 <dl class="read"><div><dt>Capacity</dt><dd id="r-q"></dd></div><div><dt>Head</dt><dd id="r-h"></dd></div><div><dt>Efficiency</dt><dd id="r-e"></dd></div><div><dt>Power to liquid, Ẇ</dt><dd id="r-w"></dd></div><div><dt>Power to impeller, bhp</dt><dd id="r-b"></dd></div><div><dt>NPSH required</dt><dd id="r-n"></dd></div></dl>
 <div style="margin:8px 0"><span class="pill" id="r-p"></span></div>
 <svg id="mini" viewBox="0 0 320 120" role="img" aria-label="Efficiency against flow for the selected impeller"></svg>
 <p class="note" style="margin-top:8px">Values come from a hand trace of the slide 142 chart, so they are approximate. Efficiency is read from the trace. Power to liquid is calculated with water at 62.4 lbm/ft³, and bhp is that power divided by efficiency. Below 80 gpm the chart prints no NPSH curve.</p>`;
 host.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{const st=ctx.explore;st.k=b.dataset.k;st.q=Math.min(st.q,IMP[st.k].qEnd);ctx.place()});
 const npf=mono(DATA.npsh);
 ctx.onExplore=()=>{const{k,q}=ctx.explore,I=IMP[k],H=I.H(q),e=I.eta(q),W=WHP(q,H),off=q/I.bep;
  $('r-q').innerHTML=Math.round(q)+' <small>gpm</small>';$('r-h').innerHTML=Math.round(H)+' <small>ft</small>';$('r-e').innerHTML='≈'+Math.round(e*100)+' <small>%</small>';$('r-w').innerHTML=W.toFixed(2)+' <small>hp</small>';$('r-b').innerHTML=(W/e).toFixed(1)+' <small>hp</small>';$('r-n').innerHTML=q<79?'– <small>ft</small>':Math.round(npf(q))+' <small>ft</small>';
  const pill=$('r-p'),pc=Math.abs(off-1);pill.textContent=pc<.08?'Close to the bep':off<1?`${Math.round((1-off)*100)}% below bep flow`:`${Math.round((off-1)*100)}% above bep flow`;pill.style.color=pc<.08?'var(--eff)':pc<.25?'var(--power)':'var(--pressure)';
  host.querySelectorAll('.segs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  const m=$('mini');m.innerHTML='';const X=v=>34+v/350*276,Y=v=>98-v/.8*84;for(const v of[0,.2,.4,.6,.8]){LN(m,34,Y(v),310,Y(v),'var(--grid)',1);TX(m,29,Y(v)+4,Math.round(v*100)+'%',{size:11,anchor:'end'})}for(const v of[0,100,200,300])TX(m,X(v),113,v,{size:11,anchor:'middle'});
  const pts=[];for(let i=0;i<=60;i++){const qq=I.qEnd*i/60;pts.push([X(qq),Y(I.eta(qq))])}E('path',{d:pathD(pts),stroke:'var(--eff)','stroke-width':2.5},m);CI(m,X(I.bep),Y(I.eta(I.bep)),4,'var(--pressure)');CI(m,X(q),Y(e),6,'var(--water)','var(--sheet)',2);};}
function go(i,t0=0){P.i=i;P.t=t0;P.hold=0;const s=SCENES[i];stage.innerHTML='';const root=E('g',{},stage);
 $('eyebrow').textContent=`Chapter ${i+1} of ${SCENES.length} · ${s.slide}`;$('title').textContent=s.title;
 const body=$('panelbody');body.innerHTML='';ctx.onExplore=null;
 if(s.free){explorePanel(body)}else{const ol=document.createElement('ol');ol.id='cues';s.cues.forEach((q,k)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.innerHTML=q.h;b.onclick=()=>{P.t=q.t;P.hold=0;render(0)};li.appendChild(b);ol.appendChild(li)});body.appendChild(ol)}
 P.draw=s.build(root,ctx);$('transport').hidden=!!s.free;
 $('ticks').innerHTML=s.cues.map(q=>`<i style="left:${q.t/s.dur*100}%"></i>`).join('');
 [...$('chapters').children].forEach((b,k)=>{const on=k===i;if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');if(on){const n=$('chapters');n.scrollLeft=b.offsetLeft-n.offsetLeft-(n.clientWidth-b.offsetWidth)/2}});
 try{location.replace('#'+s.id)}catch(e){}
 P.lastCue=-1;render(0);sync()}
function render(){const s=SCENES[P.i];P.draw(P.t,P.c);if(s.free)return;
 $('scrub').value=Math.round(P.t/s.dur*1000);$('time').textContent=fmt(P.t)+' / '+fmt(s.dur);
 let k=0;s.cues.forEach((q,i)=>{if(P.t>=q.t)k=i});
 if(k!==P.lastCue){P.lastCue=k;const ol=$('cues');[...ol.children].forEach((li,i)=>{li.className=i<k?'past':i===k?'now':''});
  if(ol.scrollHeight>ol.clientHeight+2){const li=ol.children[k];ol.scrollTop=li.offsetTop-ol.offsetTop-12}}}
function sync(){$('play').textContent=P.playing?'Pause':'Play'}
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const s=SCENES[P.i];
 if(s.free){if(!reduce)P.c+=dt;P.draw(1,P.c)}
 else if(P.playing){P.c+=dt*P.rate;
  if(P.t<s.dur){P.t=Math.min(s.dur,P.t+dt*P.rate)}else{P.hold+=dt;if(P.hold>1.6&&P.i<SCENES.length-1)go(P.i+1)}
  render()}
 requestAnimationFrame(frame)}
$('play').onclick=()=>{const s=SCENES[P.i];if(!P.playing&&P.t>=s.dur)P.t=0;P.playing=!P.playing;sync()};
$('prev').onclick=()=>go(Math.max(0,P.i-1));$('next').onclick=()=>go(Math.min(SCENES.length-1,P.i+1));
$('again').onclick=()=>{P.t=0;P.hold=0;P.playing=true;sync();render()};
const rates=[1,1.5,.75];$('speed').onclick=()=>{P.rate=rates[(rates.indexOf(P.rate)+1)%3];$('speed').textContent=P.rate+'×'};
$('scrub').oninput=e=>{const s=SCENES[P.i];P.t=e.target.value/1000*s.dur;P.hold=0;P.playing=false;sync();render()};
addEventListener('keydown',e=>{if(e.target.matches('input,button')&&e.code!=='ArrowLeft'&&e.code!=='ArrowRight')return;if(SCENES[P.i].free)return;
 if(e.code==='Space'){e.preventDefault();$('play').click()}else if(e.code==='ArrowRight'&&e.target.id!=='scrub'){P.t=Math.min(SCENES[P.i].dur,P.t+5);render()}else if(e.code==='ArrowLeft'&&e.target.id!=='scrub'){P.t=Math.max(0,P.t-5);P.hold=0;render()}});
const fromHash=()=>Math.max(0,SCENES.findIndex(s=>'#'+s.id===location.hash));
addEventListener('hashchange',()=>{const i=fromHash();if(i!==P.i)go(i)});
/* expose a seek for the viewer's scrubbing and for checks */
window.pumpSeek=(i,t)=>{P.playing=false;if(i!==P.i)go(i);P.t=t;P.c=t;render();sync()};
const startI=fromHash();go(startI);
if(reduce){P.t=SCENES[startI].free?0:SCENES[startI].dur;P.c=2;render()}
requestAnimationFrame(frame);


</script>

</body></html>
